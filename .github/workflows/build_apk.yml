name: Build ClearTok Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Create Flutter Scaffolding
      run: |
        flutter create --org com.cleartok --project-name cleartok_reborn .

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Rename APK for Release
      run: cp build/app/outputs/flutter-apk/app-release.apk ClearTok-Pro-Reborn.apk

    - name: Auto Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      if: always()
      with:
        tag_name: v2.0.0
        name: ClearTok Pro Reborn v2.0.0
        files: ClearTok-Pro-Reborn.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

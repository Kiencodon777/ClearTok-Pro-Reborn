name: Build and release Android and iOS
on:
  push:
    branches: [main, codex/v2.5-ci-release]
  workflow_dispatch:
    inputs:
      android_debug:
        description: 'Android DEBUG test APK only; no production signing or obfuscation'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  goldens:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --tags golden
  build:
    needs: goldens
    environment: ${{ github.event_name == 'workflow_dispatch' && 'staging' || 'production' }}
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jsxxxbspjmpbaomotgcj.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_OgS5NTFXDFZ0OTB1DTxDFA_Bh7YDyQ5' }}
      UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate public backend configuration
        shell: bash
        run: python3 scripts/validate_backend_config.py
      - name: Free Android runner space for debug and release builds
        if: matrix.platform == 'android'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/emulator
          df -h /
      - name: Set version
        shell: bash
        run: echo "VERSION=2.5.0-rc.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Create platform scaffolding
        run: |
          flutter create --org com.cleartok --project-name cleartok_reborn --platforms=${{ matrix.platform }} .
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi
      - run: flutter pub get
      - name: Enable Android desugaring required by notifications
        if: matrix.platform == 'android'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          content = gradle.read_text()
          if 'isCoreLibraryDesugaringEnabled' not in content:
              assert 'compileOptions {' in content
              content = content.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'desugar_jdk_libs' not in content:
              content += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          gradle.write_text(content)
          PY
      - name: Set iOS deployment target and LapinTokk bundle display name
        if: matrix.platform == 'ios'
        run: |
          python3 - <<'PY'
          import plistlib, re
          from pathlib import Path
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          project.write_text(re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;', project.read_text()))
          podfile = Path('ios/Podfile')
          if podfile.exists():
              podfile.write_text(re.sub(r"(?m)^#?\s*platform :ios, '[0-9.]+'", "platform :ios, '15.0'", podfile.read_text()))
          plist_path = Path('ios/Runner/Info.plist')
          if plist_path.exists():
              with plist_path.open('rb') as fp:
                  info = plistlib.load(fp)
              info['CFBundleDisplayName'] = 'LapinTokk'
              info['CFBundleName'] = 'LapinTokk'
              with plist_path.open('wb') as fp:
                  plistlib.dump(info, fp)
          PY
      - name: Generate app launcher icons
        run: dart run flutter_launcher_icons -f launcher_icons_${{ matrix.platform }}.yaml
      - name: Analyze all application and tests
        run: flutter analyze lib test
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Test Flutter and release scripts
        run: |
          flutter test --exclude-tags golden
          python3 -m unittest discover -s test -p '*_test.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'android'
        with:
          name: ui-previews
          path: build/ui-previews/*.png
          if-no-files-found: error
      - name: Build debug APK
        if: matrix.platform == 'android'
        run: flutter build apk --debug --build-name="${VERSION%%-*}" --build-number="$GITHUB_RUN_NUMBER" --dart-define="SUPABASE_URL=$SUPABASE_URL" --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" --dart-define="APP_VERSION=$VERSION"
      - name: Package explicitly requested staging debug APK
        if: matrix.platform == 'android' && github.event_name == 'workflow_dispatch' && inputs.android_debug
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/LapinTokk-v${VERSION}-staging-debug.apk"
      - name: Configure verified Android production signer
        if: matrix.platform == 'android' && !(github.event_name == 'workflow_dispatch' && inputs.android_debug)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_EXPECTED_CERT_SHA256 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cleartok-release.jks
        run: python3 scripts/configure_android_signing.py
      - name: Build APK
        if: matrix.platform == 'android' && !(github.event_name == 'workflow_dispatch' && inputs.android_debug)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cleartok-release.jks
          ANDROID_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private-symbols/android"
          python3 scripts/build_obfuscated.py android --symbols "$RUNNER_TEMP/private-symbols/android"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/LapinTokk-v${VERSION}.apk"
          python3 scripts/verify_apk_signer.py "dist/LapinTokk-v${VERSION}.apk"
      - name: Build unsigned IPA
        if: matrix.platform == 'ios'
        run: |
          mkdir -p "$RUNNER_TEMP/private-symbols/ios"
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            python3 scripts/build_obfuscated.py ios --symbols "$RUNNER_TEMP/private-symbols/ios"
          else
            echo "unobfuscated" > "$RUNNER_TEMP/private-symbols/ios/symbols.txt"
            flutter build ios --release --no-codesign --build-name="${VERSION%%-*}" --build-number="$GITHUB_RUN_NUMBER" --dart-define="APP_VERSION=$VERSION" --dart-define="UPDATE_FEED_URL=${{ vars.UPDATE_FEED_URL }}"
          fi
      - name: Package unsigned IPA for GBox and verify a re-signed copy
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          xattr -cr "$APP"
          python3 scripts/prepare_ios_resigning.py "$APP"
          mkdir -p dist
          python3 scripts/package_ipa.py "$APP" "dist/LapinTokk-v${VERSION}.ipa"
          CHECK_DIR="$(mktemp -d)"
          ditto -x -k "dist/LapinTokk-v${VERSION}.ipa" "$CHECK_DIR"
          APP="$CHECK_DIR/Payload/Runner.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
          # Verify that the exported bundle can be signed, using only the extracted test copy.
          while IFS= read -r -d '' nested; do
            codesign --force --sign - --timestamp=none "$nested"
          done < <(find "$APP" -depth \( -name '*.framework' -o -name '*.dylib' -o -name '*.appex' \) -print0)
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - run: python3 scripts/check_release_files.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'android' && github.event_name == 'workflow_dispatch' && inputs.android_debug
        with:
          name: staging-debug-android
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform != 'android' || !(github.event_name == 'workflow_dispatch' && inputs.android_debug)
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform != 'android' || !(github.event_name == 'workflow_dispatch' && inputs.android_debug)
        with:
          name: private-symbols-${{ matrix.platform }}-v2.5.0-rc.${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/private-symbols/${{ matrix.platform }}
          retention-days: 30
          if-no-files-found: error
  diagnostic-web:
    environment: ${{ github.event_name == 'workflow_dispatch' && 'staging' || 'production' }}
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jsxxxbspjmpbaomotgcj.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_OgS5NTFXDFZ0OTB1DTxDFA_Bh7YDyQ5' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 scripts/validate_backend_config.py
      - run: npm ci
      - run: npm test
      - run: node --test test/following_request_test.cjs
      - run: node scripts/build_diagnostic_web.cjs
      - run: node --test test/diagnostic_web_test.cjs
      - name: Build full web dashboard and Chrome/Edge extension
        run: |
          node scripts/build_extension_production.cjs
          EXTENSION_DIR=build/cleartok-web-production node --test test/web_extension_test.cjs
          node --test test/backend_rls_test.cjs
          node --test test/account_function_test.cjs
          node --test test/staging_workflow_test.cjs
          node scripts/build_admin.cjs
      - name: Package web companion
        run: |
          mkdir -p dist
          python3 -c "import shutil; shutil.make_archive('dist/LapinTokk-Diagnostic-Web-v2.5.0-rc.${{ github.run_number }}', 'zip', 'build/diagnostic-web')"
          python3 -c "import shutil; shutil.make_archive('dist/LapinTokk-Web-v2.5.0-rc.${{ github.run_number }}', 'zip', 'build/cleartok-web-production')"
          python3 -c "import shutil; shutil.make_archive('dist/LapinTokk-Admin-v2.5.0-rc.${{ github.run_number }}', 'zip', 'build/admin')"
      - run: python3 scripts/check_release_files.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-web
          path: dist/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/v2.5-ci-release')
    permissions:
      contents: write
    needs: [build, diagnostic-web]
    runs-on: ubuntu-latest
    concurrency:
      group: cleartok-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish both platforms from this commit
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          tag_name: v2.5.0-rc.${{ github.run_number }}
          name: LapinTokk v2.5.0-rc.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          body: |
            Source commit: ${{ github.sha }}
            Android APK and unsigned iOS IPA from the same build.
            Android uses a new production signing certificate. If an older installation uses a different certificate, back up local data before uninstalling it to install this RC.
            IPA is unsigned for import into GBox or another re-signing tool. The extracted archive is re-signed and verified in CI; use your own valid iOS certificate and provisioning profile to install.
            Download the .ipa asset directly. Actions artifacts are outer ZIP archives; extract those before installing the IPA.
          files: |
            dist/*.apk
            dist/*.ipa
            dist/*.zip
            dist/*.sha256

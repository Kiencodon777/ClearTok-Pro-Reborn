name: Build ClearTok Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Create Flutter Scaffolding
      run: |
        flutter create --org com.cleartok --project-name cleartok_reborn .

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Asset
      run: cp build/app/outputs/flutter-apk/app-release.apk ClearTok-Pro-Reborn-v2.1.2.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClearTok-Pro-Reborn-Release-APK
        path: ClearTok-Pro-Reborn-v2.1.2.apk

    - name: Auto Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1.2
        name: "ClearTok Pro Reborn v2.1.2 (Fix Wi-Fi Login Freeze & CAPTCHA Handler)"
        body: |
          ### ClearTok Pro Reborn v2.1.2 - Wi-Fi Login & Network Optimization

          - **Khắc phục triệt để lỗi đăng nhập xoay tròn trên Wi-Fi**:
            - Sửa lỗi treo popup/verification captcha khi đăng nhập trên mạng Wi-Fi bằng cách chuyển `supportMultipleWindows: false` và bổ sung trình chuyển hướng URL `onCreateWindow`.
            - Tắt `safeBrowsingEnabled` để tránh việc Google Safe Browsing / WebKit chặn DNS và handshake socket của ByteDance trên mạng gia đình.
            - Kích hoạt `hardwareAcceleration`, `allowsInlineMediaPlayback` giúp giải mã mượt mà puzzle trượt CAPTCHA của TikTok.
            - Bổ sung `onReceivedServerTrustAuthRequest` vượt qua các chứng chỉ SSL trung gian của nhà mạng Wi-Fi.
          - **Đợt quét Repost 100 bài**: Chống đơ app, quét mượt mà và dứt khoát.

          Unlimited Quota - Safe & Clean Architecture
        files: ClearTok-Pro-Reborn-v2.1.2.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

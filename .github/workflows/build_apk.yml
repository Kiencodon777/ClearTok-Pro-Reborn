name: Build ClearTok Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Create Flutter Scaffolding
      run: |
        flutter create --org com.cleartok --project-name cleartok_reborn .

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Asset
      run: cp build/app/outputs/flutter-apk/app-release.apk ClearTok-Pro-Reborn-v2.2.2.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClearTok-Pro-Reborn-Release-APK
        path: ClearTok-Pro-Reborn-v2.2.2.apk

    - name: Auto Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.2.2
        name: "ClearTok Pro Reborn v2.2.2 (Fix Mass Un-Like & Mass Un-Follow CSRF/Argus Bypass)"
        body: |
          ### ClearTok Pro Reborn v2.2.2 - Mass Un-Like & Mass Un-Follow Security Bypass

          - **Khắc phục triệt để lỗi invalid csrf token & Argus TL8 Plugin**:
            - **Bypass Argus TL8 Plugin**: Khởi tạo clean sandboxed native fetch tách biệt với window.fetch, vô hiệu hóa việc bị Web SDK / Argus chặn `HTTP 403`.
            - **Dynamic SecSDK CSRF Handshake**: Tự động gửi request khởi tạo bảo mật (`X-Secsdk-Csrf-Request: 1`) lấy `X-Ware-Csrf-Token` kết hợp đồng bộ cookie token (`tt_csrf_token`).
            - **Cơ chế Fallback Kép đa tầng**: Hỗ trợ đồng thời cả hai định dạng `x-www-form-urlencoded` và `application/json` trên cả 2 endpoint `/api/commit/` và `/aweme/v1/commit/`.
            - Bỏ thích (Unlike) và Bỏ theo dõi (Unfollow) hàng loạt hoạt động mượt mà, chính xác 100%.

          Unlimited Quota - Safe & Clean Architecture
        files: ClearTok-Pro-Reborn-v2.2.2.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

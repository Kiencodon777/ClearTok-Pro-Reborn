name: Build ClearTok Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Create Flutter Scaffolding
      run: |
        flutter create --org com.cleartok --project-name cleartok_reborn .

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Asset
      run: cp build/app/outputs/flutter-apk/app-release.apk ClearTok-Pro-Reborn-v2.0.4.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClearTok-Pro-Reborn-Release-APK
        path: ClearTok-Pro-Reborn-v2.0.4.apk

    - name: Auto Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.4
        name: ClearTok Pro Reborn v2.0.4 (UI/UX ProMax)
        body: |
          ### ClearTok Pro Reborn v2.0.4 — ProMax UI Edition
          
          - **Full UI/UX Overhaul**: Separated into 2 dedicated tabs (TikTok Web + Studio Reposts).
          - **Android Login Scheme Fix**: Resolved `net::ERR_UNKNOWN_URL_SCHEME` by intercepting `tiktok://` deep links.
          - **Universal Data Session Extractor**: Direct React hydration reader for instant `secUid` and user profile binding.
          - **Custom Speed Slider**: Choose between Turbo (300ms), Balanced (700ms), and Ultra Safe (1500ms).
          - **100% Unlimited**: Zero paywalls, zero quotas.
        files: ClearTok-Pro-Reborn-v2.0.4.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

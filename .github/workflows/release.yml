name: Build and release Android and iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        shell: bash
        run: echo "VERSION=2.3.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true
      - name: Create platform scaffolding
        run: flutter create --org com.cleartok --project-name cleartok_reborn --platforms=${{ matrix.platform }} .
      - run: flutter pub get
      - name: Test pagination and IPA packaging
        run: |
          flutter test test/scan_pagination_test.dart test/following_pagination_test.dart test/diagnostic_log_test.dart test/project_credits_test.dart test/app_updates_test.dart test/studio_toolbar_test.dart
          python3 -m unittest discover -s test -p '*_test.py'
      - name: Build APK
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release --no-tree-shake-icons --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER" --dart-define="APP_VERSION=$VERSION" --dart-define="UPDATE_FEED_URL=${{ vars.UPDATE_FEED_URL }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ClearTok-Pro-Reborn-v${VERSION}.apk"
      - name: Build unsigned IPA
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER" --dart-define="APP_VERSION=$VERSION" --dart-define="UPDATE_FEED_URL=${{ vars.UPDATE_FEED_URL }}"
      - name: Prepare IPA for re-signing and verify extracted bundle
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          # Give re-signers a consistent signature layout without an Apple identity.
          xattr -cr "$APP"
          while IFS= read -r -d '' nested; do
            codesign --force --sign - --timestamp=none "$nested"
          done < <(find "$APP" -depth \( -name '*.framework' -o -name '*.dylib' -o -name '*.appex' \) -print0)
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p dist
          python3 scripts/package_ipa.py build/ios/iphoneos/Runner.app "dist/ClearTok-Pro-Reborn-v${VERSION}.ipa"
          CHECK_DIR="$(mktemp -d)"
          ditto -x -k "dist/ClearTok-Pro-Reborn-v${VERSION}.ipa" "$CHECK_DIR"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$CHECK_DIR/Payload/Runner.app/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$CHECK_DIR/Payload/Runner.app"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  diagnostic-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/tiktok_transport_test.cjs
      - run: node --test test/following_request_test.cjs
      - run: node scripts/build_diagnostic_web.cjs
      - run: node --test test/diagnostic_web_test.cjs
      - name: Build full web dashboard and Chrome/Edge extension
        run: |
          node scripts/build_web_extension.cjs
          node --test test/web_extension_test.cjs
      - name: Package web companion
        run: |
          mkdir -p dist
          python3 -c "import shutil; shutil.make_archive('dist/ClearTok-Diagnostic-Web-v2.3.${{ github.run_number }}', 'zip', 'build/diagnostic-web')"
          python3 -c "import shutil; shutil.make_archive('dist/ClearTok-Pro-Web-v2.3.${{ github.run_number }}', 'zip', 'build/cleartok-web')"
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/*.zip
          if-no-files-found: error
  release:
    needs: [build, diagnostic-web]
    runs-on: ubuntu-latest
    concurrency:
      group: cleartok-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish both platforms from this commit
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.${{ github.run_number }}
          name: ClearTok Pro Reborn v2.3.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          body: |
            Source commit: ${{ github.sha }}
            Android APK and unsigned iOS IPA from the same build.
            IPA includes verified ad-hoc signatures for re-signing compatibility; sign it with your own iOS certificate before installation.
            Download the .ipa asset directly. Actions artifacts are outer ZIP archives; extract those before installing the IPA.
          files: |
            dist/*.apk
            dist/*.ipa
            dist/*.zip
            dist/*.sha256
      - name: Checkout public update metadata
        if: vars.UPDATE_FEED_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.UPDATE_FEED_REPO }}
          ref: main
          ssh-key: ${{ secrets.UPDATE_FEED_SSH_KEY }}
          path: public-update-feed
      - name: Publish update feed after successful release
        if: vars.UPDATE_FEED_REPO != ''
        env:
          VERSION: 2.3.${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('public-update-feed/update.json')
          version = os.environ['VERSION']
          old = json.loads(path.read_text()) if path.exists() else {'version': '0.0.0'}
          if tuple(map(int, version.split('.'))) >= tuple(map(int, old['version'].split('.'))):
              data = {'version': version, 'notes': 'Bản cập nhật ClearTok Pro Reborn. Xem ghi chú trên GitHub Releases.', 'url': 'https://github.com/Kiencodon777/ClearTok-Pro-Reborn/releases/tag/v' + version}
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git -C public-update-feed config user.name 'ClearTok Release Bot'
          git -C public-update-feed config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C public-update-feed add update.json
          if ! git -C public-update-feed diff --cached --quiet; then
            git -C public-update-feed commit -m "Publish ClearTok v$VERSION metadata"
            git -C public-update-feed push
          fi

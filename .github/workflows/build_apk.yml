name: Build ClearTok Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Create Flutter Scaffolding
      run: |
        flutter create --org com.cleartok --project-name cleartok_reborn .

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Asset
      run: cp build/app/outputs/flutter-apk/app-release.apk ClearTok-Pro-Reborn-v2.1.0.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClearTok-Pro-Reborn-Release-APK
        path: ClearTok-Pro-Reborn-v2.1.0.apk

    - name: Auto Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1.0
        name: ClearTok Pro Reborn v2.1.0 (Major Upgrade: Smart Anti-Ban, Analytics & Export)
        body: |
          # 🚀 ClearTok Pro Reborn v2.1.0 — Major Innovation Release
          
          Bản phát hành lớn nâng cấp toàn diện ứng dụng thành **Siêu Vũ Khí Quản Trị TikTok (All-in-One Powerhouse)** với 5 sáng kiến đột phá:

          ---

          ### 🌟 5 Sáng Kiến & Tính Năng Đột Phá Mới:

          1. **🛡️ Smart Anti-Ban & Humanized Pulse Jitter Engine:**
             - Bổ sung cơ chế **Nhịp Thở Tự Nhiên (Humanized Deep Rest)**: Cứ sau một lượng video (10-20 items), app sẽ tự động nghỉ sâu 12-20s với đồng hồ đếm ngược giải nhiệt, né tuyệt đối thuật toán phát hiện bot của TikTok.
             - 3 Cấu hình tốc độ thông minh:
               - 🚀 **Turbo** (300ms / video, không nghỉ).
               - ⚖️ **Cân Bằng [Khuyên dùng]** (700ms / video, nghỉ 12s sau mỗi 20 video).
               - 🛡️ **Siêu An Toàn [Cày Đêm]** (1500ms / video, nghỉ 20s sau mỗi 10 video).

          2. **📊 Studio Analytics Dashboard:**
             - Thống kê trực quan chỉ bằng 1 chạm: Tổng số video đã repost, tổng lượng Like, Like trung bình trên mỗi video.
             - Bảng xếp hạng **Top Tác Giả Được Bạn Repost Nhiều Nhất**.

          3. **💾 Export & Backup Engine (CSV & JSON):**
             - Sao lưu toàn bộ danh sách video (ID, Username, Nickname, Like, Thời gian, Link Cover, Mô tả) vào bộ nhớ tạm dạng CSV hoặc JSON chỉ với 1 click trước khi hủy hàng loạt.

          4. **🎯 Smart Filters Pro (Lọc Đa Tiêu Chí):**
             - **Lọc theo Tác Giả (@Creator)**: Hộp thoại chọn nhanh tác giả cụ thể để xóa sạch repost của một kênh drama hoặc idol.
             - Tìm kiếm thời gian thực theo tên tác giả hoặc nội dung mô tả video.

          5. **⚡ Mở Rộng Hệ Sinh Thái (Un-Like & Un-Follow API Support):**
             - Bổ sung API endpoints và Web Bridge sẵn sàng cho việc hủy Thích (`Mass Un-Like`) và hủy Theo dõi (`Mass Un-Follow`) hàng loạt.
             - Thanh công cụ chuyển đổi nhanh Studio Hub (`Reposts` | `Un-Like` | `Un-Follow`).

          6. **🔔 Background Notification Support:**
             - Tích hợp thông báo Ongoing Notification hiển thị thanh phần trăm tiến độ và trạng thái giải nhiệt khi người dùng chuyển ứng dụng.

          ---
          **Zero Paywalls • Unlimited Quota ∞ • Safe & Open Source**
        files: ClearTok-Pro-Reborn-v2.1.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build ClearTok Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Create Flutter Scaffolding
      run: |
        flutter create --org com.cleartok --project-name cleartok_reborn .

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Asset
      run: cp build/app/outputs/flutter-apk/app-release.apk ClearTok-Pro-Reborn-v2.1.1.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClearTok-Pro-Reborn-Release-APK
        path: ClearTok-Pro-Reborn-v2.1.1.apk

    - name: Auto Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1.1
        name: "ClearTok Pro Reborn v2.1.1 (Scan Batch Limit 100 & Anti-Freeze)"
        body: |
          ### ClearTok Pro Reborn v2.1.1 - Scan Batch Limit & Performance Upgrade

          Theo góp ý đóng góp từ bạn của LO:
          - **Tùy chọn giới hạn đợt quét (Scan Batch Limit)**: Thêm các nút chọn linh hoạt [50], [100 bài ⭐ Khuyên dùng], [200], [Tất cả ∞].
          - **Chống đơ/treo quét**: Quét dừng dứt khoát ngay khi đủ 100 bài (thay vì cố quét cạn hàng ngàn video gây đứng máy hoặc rate-limit).
          - **Hiển thị trực quan tiến độ quét**: Nút quét cập nhật realtime số lượng bài đã nạp (`X/100`).
          - Tích hợp trọn vẹn Smart Anti-Ban, Analytics Dashboard, và sao lưu CSV/JSON.

          Unlimited Quota - Safe & Clean Architecture
        files: ClearTok-Pro-Reborn-v2.1.1.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

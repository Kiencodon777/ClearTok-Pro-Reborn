name: Build ClearTok Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Create Flutter Scaffolding
      run: |
        flutter create --org com.cleartok --project-name cleartok_reborn .

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Asset
      run: cp build/app/outputs/flutter-apk/app-release.apk ClearTok-Pro-Reborn-v2.2.1.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClearTok-Pro-Reborn-Release-APK
        path: ClearTok-Pro-Reborn-v2.2.1.apk

    - name: Auto Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.2.1
        name: "ClearTok Pro Reborn v2.2.1 (Fix Pagination Cursor & Scan 50/100/200 Full Batches)"
        body: |
          ### ClearTok Pro Reborn v2.2.1 - Pagination Cursor & Deep Scan Fix

          - **Khắc phục lỗi kẹt 30 bài khi chọn 50 / 100 / 200 bài**:
            - Sửa cơ chế phân trang cursor của TikTok: Đọc linh hoạt cả `data.cursor`, `data.max_cursor`, `data.min_cursor` và fallback tự động sang timestamp của video cuối batch.
            - Hỗ trợ đầy đủ cờ `has_more` kiểu số (`1`), boolean (`true`), chuỗi (`'1'`) hoặc tự động lặp tiếp khi batch trả về đủ bài.
            - Bây giờ khi chọn **100 bài**, app sẽ tự động quét liên tục 4 batch (30 -> 60 -> 90 -> 120 bài) cho đến khi đạt đủ mục tiêu.
            - Tương tự cho mốc **50 bài**, **200 bài** hoặc **Hết**.
          - Kích hoạt đầy đủ cả 3 chế độ: Reposts, Mass Un-Like, và Mass Un-Follow.

          Unlimited Quota - Safe & Clean Architecture
        files: ClearTok-Pro-Reborn-v2.2.1.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

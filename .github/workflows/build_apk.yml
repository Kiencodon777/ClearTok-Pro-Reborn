name: Build ClearTok Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Create Flutter Scaffolding
      run: |
        flutter create --org com.cleartok --project-name cleartok_reborn .

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Asset
      run: cp build/app/outputs/flutter-apk/app-release.apk ClearTok-Pro-Reborn-v2.2.0.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClearTok-Pro-Reborn-Release-APK
        path: ClearTok-Pro-Reborn-v2.2.0.apk

    - name: Auto Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.2.0
        name: "ClearTok Pro Reborn v2.2.0 (Mass Un-Like & Mass Un-Follow Fully Live)"
        body: |
          ### ClearTok Pro Reborn v2.2.0 - Complete Multi-Module Release

          - **Kích hoạt chính thức 2 module Mass Un-Like & Mass Un-Follow**:
            - **Mass Un-Like**: Quét toàn bộ video đã thích (`/api/favorite/item_list/`) và bỏ thích hàng loạt (`/api/commit/item/digg/`).
            - **Mass Un-Follow**: Quét danh sách đang follow (`/api/user/list/`) và hủy theo dõi hàng loạt (`/api/commit/follow/user/`).
            - Chuyển đổi mượt mà 3 chế độ trên thanh Studio Hub (`Reposts` | `Mass Un-Like` | `Mass Un-Follow`).
          - **Tùy chọn đợt quét 100 bài chống đơ**: Tùy chọn 50, 100, 200 hoặc Tất cả, dừng dứt khoát tránh treo app.
          - **Khắc phục lỗi đăng nhập trên Wi-Fi**: Loại bỏ treo popup, bỏ qua Safe Browsing và tối ưu SSL handshake.

          Unlimited Quota - Safe & Clean Architecture
        files: ClearTok-Pro-Reborn-v2.2.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build ClearTok Pro iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - '.github/workflows/build_ios.yml'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Create iOS Scaffolding
      run: |
        flutter create --org com.cleartok --project-name cleartok_reborn --platforms=ios .

    - name: Install Dependencies & CocoaPods
      run: |
        flutter pub get
        cd ios
        pod install --repo-update
        cd ..

    - name: Build iOS Application (Unsigned Release)
      run: |
        flutter build ios --release --no-codesign

    - name: Package Payload into IPA
      run: |
        mkdir -p Payload
        cp -r build/ios/iphoneos/Runner.app Payload/
        zip -r ClearTok-Pro-Reborn-v2.0.5.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClearTok-Pro-Reborn-Release-IPA
        path: ClearTok-Pro-Reborn-v2.0.5.ipa

    - name: Auto Publish IPA to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.5
        name: ClearTok Pro Reborn v2.0.5 (Live Deletion Engine Fix)
        files: ClearTok-Pro-Reborn-v2.0.5.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

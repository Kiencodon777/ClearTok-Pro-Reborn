name: Build ClearTok Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter Engine
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Create Flutter Scaffolding
      run: |
        flutter create --org com.cleartok --project-name cleartok_reborn .

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Asset
      run: cp build/app/outputs/flutter-apk/app-release.apk ClearTok-Pro-Reborn-v2.1.0.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClearTok-Pro-Reborn-Release-APK
        path: ClearTok-Pro-Reborn-v2.1.0.apk

    - name: Auto Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1.0
        name: "ClearTok Pro Reborn v2.1.0 (Smart Anti-Ban, Analytics & Export)"
        body: |
          ### ClearTok Pro Reborn v2.1.0 - Major Innovation Release

          Bản phát hành lớn nâng cấp toàn diện ứng dụng thành Siêu Vũ Khí Quản Trị TikTok:

          1. Smart Anti-Ban & Humanized Pulse Jitter:
             - Tự động nghỉ sâu 12s-20s sau mỗi 10-20 video để giải nhiệt và né quét bot của TikTok.
             - 3 Profiles: Turbo (300ms), Can Bang (700ms), Sieu An Toan (1500ms).
          2. Studio Analytics Dashboard:
             - Thống kê tổng số video, tổng like, like trung bình, và bảng xếp hạng Top Tác Giả được bạn repost nhiều nhất.
          3. Export & Backup Engine (CSV & JSON):
             - 1-click copy toàn bộ danh sách video đã quét dạng CSV hoặc JSON vào bộ nhớ tạm.
          4. Smart Filters Pro:
             - Lọc nhanh theo từng tác giả cụ thể (@Creator), nhiều Like, mới nhất, cũ nhất.
          5. Ecosystem Expansion (Un-Like & Un-Follow API Support):
             - Mở rộng Web Bridge cho hủy Thích và hủy Theo dõi hàng loạt.
          6. Background Ongoing Notification Support:
             - Thông báo tiến độ trực tiếp khi người dùng chuyển ứng dụng.

          Unlimited Quota - Safe & Clean Architecture
        files: ClearTok-Pro-Reborn-v2.1.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
